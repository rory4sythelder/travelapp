<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>County Travel Tracker</title>
  
  <!-- Mapbox and Turf.js loaded directly from the web -->
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: Arial, sans-serif; }
    #sidebar { width: 370px; background: #f8f9fa; padding: 20px; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 1; }
    #map { flex-grow: 1; }
    input, button { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    .save-btn { background: #28a745; }
    .save-btn:hover { background: #218838; }
    .trip-item { border-bottom: 1px solid #ddd; padding: 10px 0; cursor: pointer; }
    .trip-item:hover { background-color: #e9ecef; }
    .trip-details { display: none; padding: 10px; background: #fff; border: 1px solid #ddd; margin-top: 5px; max-height: 150px; overflow-y: auto; font-size: 0.9em; }
    
    .action-btn {
      padding: 2px 0;
      font-size: 0.8em;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      width: 55px; /* Standardized width to prevent size shifts */
      text-align: center;
      display: inline-block;
    }
    .toggle-btn { background: #6c757d; color: white; margin-right: 5px; }
    .toggle-btn:hover { background: #5a6268; }
    .delete-btn { background: #dc3545; color: white; }
    .delete-btn:hover { background: #c82333; }

    /* Autocomplete dropdown styles */
    .autocomplete-container { position: relative; margin-bottom: 10px; }
    #suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .suggestion-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }
    .suggestion-item:hover { background: #f0f0f0; }

    /* Map Legend Styles */
    #legend {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      font-size: 0.85em;
      z-index: 2;
    }
    .legend-scale { display: flex; height: 15px; margin-bottom: 5px; border: 1px solid #ccc; }
    .legend-labels { display: flex; justify-content: space-between; font-weight: bold; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>County Travel Tracker</h3>
    
    <!-- Dynamic Destination Inputs Container -->
    <div id="inputsContainer">
      <div class="autocomplete-container">
        <input type="text" class="stop-input" placeholder="Origin" oninput="fetchSuggestions(this, 0)">
        <div class="suggestions" style="position:absolute; top:100%; left:0; right:0; background:white; border:1px solid #ccc; z-index:10; max-height:150px; overflow-y:auto; display:none;"></div>
      </div>
      <div class="autocomplete-container">
        <input type="text" class="stop-input" placeholder="Destination" oninput="fetchSuggestions(this, 1)">
        <div class="suggestions" style="position:absolute; top:100%; left:0; right:0; background:white; border:1px solid #ccc; z-index:10; max-height:150px; overflow-y:auto; display:none;"></div>
      </div>
    </div>

    <!-- Active Waypoints UI -->
    <div id="waypointContainer" style="display: none; margin-top: 15px;">
      <strong>Selected Stops:</strong>
      <ul id="waypointList" style="list-style-type: disc; padding-left: 20px; font-size: 0.9em; margin-top: 5px; margin-bottom: 0;"></ul>
    </div>

    <div id="currentTrip" style="display: none; margin-top: 20px;">
      <h3>Current Trip</h3>
      <p>Counties Visited: <span id="countyCount">0</span></p>
      <input type="text" id="tripName" placeholder="Name this trip">
      <button class="save-btn" onclick="saveTrip()">Save Trip</button>
    </div>

    <h3 style="margin-top: 30px;">Trip History</h3>
    <div id="historyList"></div>
  </div>

  <div id="map"></div>

  <!-- Map Legend -->
  <div id="legend">
    <strong>Frequency of Visits</strong>
    <div class="legend-scale" id="legendScale"></div>
    <div class="legend-labels">
      <span>1</span>
      <span>3</span>
      <span>6</span>
      <span>9</span>
      <span>10+</span>
    </div>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoicm9yeTRzeXRoZWxkZXIiLCJhIjoiY205MXV2eXh1MDUxejJqb2VyOXlqcHduMSJ9.jayP103_JPGAKudstFC6Zw';

    let map;
    let waypoints = []; // Stores [lng, lat]
    let waypointNames = []; // Stores names for sidebar display
    let visitedCounties = [];
    let tripHistory = JSON.parse(localStorage.getItem('mapTrips')) || [];
    let countyGeoJSON = null;
    let markers = [];

    const stateFIPS = {
      '01': 'Alabama', '02': 'Alaska', '04': 'Arizona', '05': 'Arkansas', '06': 'California',
      '08': 'Colorado', '09': 'Connecticut', '10': 'Delaware', '11': 'District of Columbia',
      '12': 'Florida', '13': 'Georgia', '15': 'Hawaii', '16': 'Idaho', '17': 'Illinois',
      '18': 'Indiana', '19': 'Iowa', '20': 'Kansas', '21': 'Kentucky', '22': 'Louisiana',
      '23': 'Maine', '24': 'Maryland', '25': 'Massachusetts', '26': 'Michigan', '27': 'Minnesota',
      '28': 'Mississippi', '29': 'Missouri', '30': 'Montana', '31': 'Nebraska', '32': 'Nevada',
      '33': 'New Hampshire', '34': 'New Jersey', '35': 'New Mexico', '36': 'New York',
      '37': 'North Carolina', '38': 'North Dakota', '39': 'Ohio', '40': 'Oklahoma',
      '41': 'Oregon', '42': 'Pennsylvania', '44': 'Rhode Island', '45': 'South Carolina',
      '46': 'South Dakota', '47': 'Tennessee', '48': 'Texas', '49': 'Utah', '50': 'Vermont',
      '51': 'Virginia', '53': 'Washington', '54': 'West Virginia', '55': 'Wisconsin', '56': 'Wyoming',
      '72': 'Puerto Rico'
    };

    map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [-98.5795, 39.8283],
      zoom: 3,
      maxBounds: [
        [-180, 10],
        [-45, 85]
      ]
    });

    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    map.on('load', () => {
      // 1. Base Counties Layer
      map.addSource('all-counties', { type: 'geojson', data: turf.featureCollection([]) });
      map.addLayer({
        id: 'all-counties-layer',
        type: 'fill',
        source: 'all-counties',
        paint: {
          'fill-color': '#d3d3d3',
          'fill-opacity': 0.4,
          'fill-outline-color': '#a9a9a9'
        }
      });

      // 2. Heatmap / Multi-visit Gradient Layer using Mapbox expressions based on visit count
      map.addSource('highlighted-counties', { type: 'geojson', data: turf.featureCollection([]) });
      map.addLayer({
        id: 'highlighted-counties-layer',
        type: 'fill',
        source: 'highlighted-counties',
        paint: {
          'fill-color': [
            'interpolate',
            ['linear'],
            ['get', 'visitCount'],
            1, '#ffb6c1',   // Light pink
            3, '#ff8fa3',
            6, '#ff6885',
            9, '#ff4068',
            10, '#e60039'   // Darker shade of pink/red for 10+
          ],
          'fill-opacity': 0.75,
          'fill-outline-color': '#ff4068'
        }
      });

      // 3. Route Line Layer (for active routing & toggled trip routes)
      map.addSource('route', { type: 'geojson', data: turf.featureCollection([]) });
      map.addLayer({
        id: 'route-layer',
        type: 'line',
        source: 'route',
        paint: { 'line-color': '#3887be', 'line-width': 5 }
      });
      
      fetch('counties.geojson')
        .then(res => res.json())
        .then(data => { 
          countyGeoJSON = data; 
          map.getSource('all-counties').setData(countyGeoJSON);
          updateHighlights();
        })
        .catch(err => console.error("Make sure counties.geojson is uploaded!", err));
        
      renderHistory();
      buildLegendGradient();
    });

    // Build legend gradient box dynamically
    function buildLegendGradient() {
      const scale = document.getElementById('legendScale');
      scale.style.background = 'linear-gradient(to right, #ffb6c1, #ff8fa3, #ff6885, #ff4068, #e60039)';
    }

    // Map Click Event
    map.on('click', async (e) => {
      const coords = [e.lngLat.lng, e.lngLat.lat];
      let placeName = `Coordinates: ${coords[0].toFixed(3)}, ${coords[1].toFixed(3)}`;
      try {
        const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${coords[0]},${coords[1]}.json?access_token=${mapboxgl.accessToken}`);
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          placeName = data.features[0].place_name;
        }
      } catch (err) {
        console.error("Reverse geocoding failed", err);
      }

      addWaypoint(coords, placeName);
    });

    // Autocomplete handling for dynamic inputs
    let debounceTimer;
    function fetchSuggestions(inputElement, index) {
      clearTimeout(debounceTimer);
      const query = inputElement.value;
      const suggestionsBox = inputElement.nextElementSibling;
      
      if (!query || query.length < 3) {
        suggestionsBox.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${mapboxgl.accessToken}&autocomplete=true&limit=5&bbox=-180,10,-45,85`);
          const data = await res.json();
          
          if (data.features && data.features.length > 0) {
            suggestionsBox.innerHTML = '';
            data.features.forEach(feature => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = feature.place_name;
              div.onclick = () => selectSuggestion(feature, inputElement, index);
              suggestionsBox.appendChild(div);
            });
            suggestionsBox.style.display = 'block';
          } else {
            suggestionsBox.style.display = 'none';
          }
        } catch (err) {
          console.error("Geocoding error", err);
        }
      }, 300);
    }

    function selectSuggestion(feature, inputElement, index) {
      inputElement.value = feature.place_name;
      inputElement.nextElementSibling.style.display = 'none';
      const coords = feature.center;
      
      map.flyTo({ center: coords, zoom: 10 });
      assignWaypointAtIndex(coords, feature.place_name, index);
    }

    // Assign or update waypoint at specific index based on dynamic inputs
    function assignWaypointAtIndex(coords, placeName, index) {
      waypoints[index] = coords;
      waypointNames[index] = placeName;

      if (markers[index]) {
        markers[index].remove();
      }
      markers[index] = new mapboxgl.Marker().setLngLat(coords).addTo(map);

      updateWaypointUI();

      const validWaypoints = waypoints.filter(w => w !== undefined);
      if (validWaypoints.length > 1) {
        calculateRouteForWaypoints(validWaypoints);
      }
    }

    function addWaypoint(coords, placeName) {
      const nextIndex = waypoints.length;
      waypoints.push(coords);
      waypointNames.push(placeName);

      const marker = new mapboxgl.Marker().setLngLat(coords).addTo(map);
      markers.push(marker);

      const inputs = document.querySelectorAll('.stop-input');
      if (inputs[nextIndex]) {
        inputs[nextIndex].value = placeName;
      } else {
        addDestinationInputBox(placeName);
      }

      updateWaypointUI();

      const validWaypoints = waypoints.filter(w => w !== undefined);
      if (validWaypoints.length > 1) {
        calculateRouteForWaypoints(validWaypoints);
      }
    }

    function addDestinationInputBox(val = '') {
      const container = document.getElementById('inputsContainer');
      const index = container.children.length;
      const div = document.createElement('div');
      div.className = 'autocomplete-container';
      div.innerHTML = `
        <input type="text" class="stop-input" value="${val}" placeholder="Destination" oninput="fetchSuggestions(this, ${index})">
        <div class="suggestions" style="position:absolute; top:100%; left:0; right:0; background:white; border:1px solid #ccc; z-index:10; max-height:150px; overflow-y:auto; display:none;"></div>
      `;
      container.appendChild(div);
    }

    function updateWaypointUI() {
      const validNames = waypointNames.filter(n => n !== undefined && n !== '');
      const container = document.getElementById('waypointContainer');
      const list = document.getElementById('waypointList');
      
      list.innerHTML = '';
      validNames.forEach(name => {
        const li = document.createElement('li');
        li.innerText = name;
        list.appendChild(li);
      });

      if (validNames.length > 0) {
        container.style.display = 'block';
      } else {
        container.style.display = 'none';
      }

      const inputs = document.querySelectorAll('.stop-input');
      const lastInput = inputs[inputs.length - 1];
      if (inputs.length >= 2 && lastInput && lastInput.value.trim() !== '') {
        addDestinationInputBox();
      }
    }

    // Calculate and display route for given waypoints
    async function calculateRouteForWaypoints(activeWaypoints) {
      if (activeWaypoints.length < 2) return;
      
      const coordString = activeWaypoints.map(p => `${p[0]},${p[1]}`).join(';');
      const res = await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving/${coordString}?geometries=geojson&access_token=${mapboxgl.accessToken}`);
      const data = await res.json();
      
      if (data.routes && data.routes.length > 0) {
        const routeGeoJSON = data.routes[0].geometry;
        map.getSource('route').setData(routeGeoJSON);

        if (countyGeoJSON) {
          const line = turf.lineString(routeGeoJSON.coordinates);
          visitedCounties = [];
          
          const uniqueCounties = new Map(); 

          turf.featureEach(countyGeoJSON, (currentCounty) => {
            if (turf.booleanIntersects(line, currentCounty)) {
                const geoid = currentCounty.properties.GEOID || currentCounty.properties.STATEFP + currentCounty.properties.COUNTYFP;
                const baseName = currentCounty.properties.NAME || 'Unknown County';
                
                let stateName = 'Unknown State';
                if (currentCounty.properties.STATEFP && stateFIPS[currentCounty.properties.STATEFP]) {
                  stateName = stateFIPS[currentCounty.properties.STATEFP];
                } else if (currentCounty.properties.STATE_NAME) {
                  stateName = currentCounty.properties.STATE_NAME;
                }
                
                const fullName = `${baseName} (${stateName})`;
                uniqueCounties.set(geoid, { geoid, name: fullName });
            }
          });
          
          visitedCounties = Array.from(uniqueCounties.values());

          document.getElementById('currentTrip').style.display = 'block';
          document.getElementById('countyCount').innerText = visitedCounties.length;
        }
      }
    }

    // Highlight counties and manage route display for visible trips
    async function updateHighlights() {
      if (!map.getSource('highlighted-counties' ) || !countyGeoJSON) return;

      const countyCounts = {};
      const visibleTripCoords = [];

      tripHistory.forEach(trip => {
        if (trip.visible !== false) {
          trip.counties.forEach(c => {
            countyCounts[c.geoid] = (countyCounts[c.geoid] || 0) + 1;
          });
          // If the trip has saved waypoints or we can fetch route geometry for its counties/waypoints, collect them
          if (trip.waypoints && trip.waypoints.length > 1) {
            visibleTripCoords.push(trip.waypoints);
          }
        }
      });

      // Highlight counties
      const highlightedFeatures = [];
      countyGeoJSON.features.forEach(feature => {
        const geoid = feature.properties.GEOID || feature.properties.STATEFP + feature.properties.COUNTYFP;
        if (countyCounts[geoid]) {
          const clonedFeature = JSON.parse(JSON.stringify(feature));
          clonedFeature.properties.visitCount = countyCounts[geoid];
          highlightedFeatures.push(clonedFeature);
        }
      });
      map.getSource('highlighted-counties').setData(turf.featureCollection(highlightedFeatures));

      // Handle route line for visible trips
      if (visibleTripCoords.length > 0) {
        // Fetch and display routes for visible trips
        // For simplicity, we can fetch the route for the first visible trip, or combine them if multiple
        const coordString = visibleTripCoords[0].map(p => `${p[0]},${p[1]}`).join(';');
        try {
          const res = await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving/${coordString}?geometries=geojson&access_token=${mapboxgl.accessToken}`);
          const data = await res.json();
          if (data.routes && data.routes.length > 0) {
            map.getSource('route').setData(data.routes[0].geometry);
          }
        } catch (err) {
          console.error("Failed to fetch route for visible trip", err);
        }
      } else {
        // If no saved trips are visible, check if we currently have an active editing trip route
        const activeWaypoints = waypoints.filter(w => w !== undefined);
        if (activeWaypoints.length > 1) {
          calculateRouteForWaypoints(activeWaypoints);
        } else {
          map.getSource('route').setData(turf.featureCollection([]));
        }
      }
    }

    function toggleTripVisibility(event, id) {
      event.stopPropagation();
      const trip = tripHistory.find(t => t.id === id);
      if (trip) {
        trip.visible = !(trip.visible !== false);
        localStorage.setItem('mapTrips', JSON.stringify(tripHistory));
        updateHighlights();
        renderHistory();
      }
    }

    function deleteTrip(event, id) {
      event.stopPropagation();
      if (confirm('Are you sure you want to delete this trip?')) {
        tripHistory = tripHistory.filter(t => t.id !== id);
        localStorage.setItem('mapTrips', JSON.stringify(tripHistory));
        updateHighlights();
        renderHistory();
      }
    }

    function saveTrip() {
      const name = document.getElementById('tripName').value;
      if (!name || visitedCounties.length === 0) return;

      const activeWaypoints = waypoints.filter(w => w !== undefined);
      const newTrip = {
        id: Date.now(),
        name: name,
        counties: visitedCounties,
        waypoints: activeWaypoints, // Save waypoints so we can redraw the route when toggled "Show"
        date: new Date().toLocaleDateString(),
        visible: true
      };

      tripHistory.unshift(newTrip);
      localStorage.setItem('mapTrips', JSON.stringify(tripHistory));
      
      // Reset UI
      document.getElementById('tripName').value = '';
      document.getElementById('currentTrip').style.display = 'none';
      document.getElementById('waypointContainer').style.display = 'none';
      document.getElementById('waypointList').innerHTML = '';
      
      document.getElementById('inputsContainer').innerHTML = `
        <div class="autocomplete-container">
          <input type="text" class="stop-input" placeholder="Origin" oninput="fetchSuggestions(this, 0)">
          <div class="suggestions" style="position:absolute; top:100%; left:0; right:0; background:white; border:1px solid #ccc; z-index:10; max-height:150px; overflow-y:auto; display:none;"></div>
        </div>
        <div class="autocomplete-container">
          <input type="text" class="stop-input" placeholder="Destination" oninput="fetchSuggestions(this, 1)">
          <div class="suggestions" style="position:absolute; top:100%; left:0; right:0; background:white; border:1px solid #ccc; z-index:10; max-height:150px; overflow-y:auto; display:none;"></div>
        </div>
      `;
      
      waypoints = [];
      waypointNames = [];
      visitedCounties = [];
      map.getSource('route').setData(turf.featureCollection([]));
      
      markers.forEach(m => m.remove());
      markers = [];

      renderHistory();
      updateHighlights();
    }

    function toggleDetails(id) {
      const detailsDiv = document.getElementById(`details-${id}`);
      if (detailsDiv.style.display === 'block') {
        detailsDiv.style.display = 'none';
      } else {
        detailsDiv.style.display = 'block';
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      tripHistory.forEach(trip => {
        const countyNames = trip.counties.map(c => c.name).join(', ');
        const isVisible = trip.visible !== false;
        const toggleText = isVisible ? 'Hide' : 'Show';
        
        list.innerHTML += `
          <div class="trip-item" onclick="toggleDetails(${trip.id})">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
              <strong>${trip.name}</strong>
              <div>
                <button class="action-btn toggle-btn" onclick="toggleTripVisibility(event, ${trip.id})">${toggleText}</button>
                <button class="action-btn delete-btn" onclick="deleteTrip(event, ${trip.id})">Delete</button>
              </div>
            </div>
            <small>${trip.date} • ${trip.counties.length} counties</small>
            <div id="details-${trip.id}" class="trip-details">
              <strong>Counties Visited:</strong><br>
              ${countyNames}
            </div>
          </div>
        `;
      });
    }
    
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.autocomplete-container')) {
            document.querySelectorAll('.suggestions').forEach(box => box.style.display = 'none');
        }
    });
  </script>
</body>
</html>
